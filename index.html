<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARN - 應用程式下載</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 360px;
            padding: 36px 24px;
            text-align: center;
        }

        .app-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .app-subtitle {
            font-size: 14px;
            color: #86868b;
            margin-bottom: 32px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 0;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* 安卓按鈕 */
        .btn-android {
            background-color: #3ddc84;
            color: #000000;
        }

        /* 蘋果按鈕 */
        .btn-ios {
            background-color: #000000;
            color: #ffffff;
        }

        /* 網頁版按鈕 */
        .btn-web {
            background-color: #0071e3;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="app-title">ARN</h1>
        <p class="app-subtitle">請選擇適合您裝置的平台進入</p>

        <div class="btn-group">
            <!-- 1. 安卓下載按鈕 (含 SVG 圖標) -->
            <a href="https://drive.google.com/uc?export=download&id=1u2VW73fl_NiQ3YlpXOejy_Ro5ghVURZZ" class="btn btn-android" target="_blank">
                <svg viewBox="0 0 24 24">
                    <path d="M6 18c0 .55.45 1 1 1h1v3c0 .55.45 1 1 1s1-.45 1-1v-3h4v3c0 .55.45 1 1 1s1-.45 1-1v-3h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zm-4.97-4.11l1.17-2.03c.12-.21.04-.48-.17-.6-.21-.12-.48-.04-.6.17l-1.22 2.11C13.68 3.21 12.86 3 12 3s-1.68.21-2.71.54L8.07 1.43c-.12-.21-.39-.29-.6-.17-.21.12-.29.39-.17.6l1.17 2.03C6.73 4.96 5 6.82 5 9h14c0-2.18-1.73-4.04-3.47-5.11zM9 6.5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
                </svg>
                <span>安卓下載</span>
            </a>

            <!-- 2. 蘋果下載按鈕 (含 SVG 圖標) -->
            <a href="https://apps.apple.com" target="_blank" class="btn btn-ios">
                <svg viewBox="0 0 24 24">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.09c.66-.8 1.11-1.92.99-3.04-.96.04-2.13.64-2.82 1.44-.61.71-1.14 1.86-.99 2.96 1.07.08 2.16-.56 2.82-1.36z"/>
                </svg>
                <span>蘋果下載</span>
            </a>

            <!-- 3. 網頁版按鈕 (含 SVG 圖標) -->
            <a href="https://aeverhub.github.io/ARN/" class="btn btn-web">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
                <span>網頁版</span>
            </a>
        </div>
    </div>

</body>
</html>
